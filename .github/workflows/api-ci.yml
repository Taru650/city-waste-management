name: API CI

on:
  push:
    paths: ['apps/api/**', '.github/workflows/api-ci.yml']
  pull_request:
    paths: ['apps/api/**', '.github/workflows/api-ci.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cwm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Media tooling (ffmpeg) and S3 emulator for tests (moto)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m venv /opt/moto-venv && /opt/moto-venv/bin/pip install --quiet "moto[server]"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npx jest --runInBand --selectProjects e2e --testPathIgnorePatterns security
      - name: Security tests
        run: npm run test:security
      - name: Dependency audit (production deps, high+)
        run: npm run audit:prod

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cwm-api:ci apps/api
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cwm-api:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
