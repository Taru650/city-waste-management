# Local development / pilot stack. Production: managed PostgreSQL with PITR, secrets from a vault,
# TLS-terminating nginx + WAF in front of the API.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: cwm
      POSTGRES_USER: cwm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [dbdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]   # never expose the DB publicly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cwm -d cwm"]
      interval: 5s
      retries: 10

  minio:
    # Pin images by digest (image@sha256:...) when deploying; tags move.
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes: [miniodata:/data]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]

  # Creates the private media bucket once.
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 1; done;
      mc mb --ignore-existing local/cwm-media && mc anonymous set none local/cwm-media"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  clamav:
    image: clamav/clamav:1.4
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      retries: 20

  api:
    build: ../apps/api
    env_file: ../apps/api/.env
    environment:
      DATABASE_URL: postgres://cwm:${POSTGRES_PASSWORD}@db:5432/cwm
      NODE_ENV: ${NODE_ENV:-development}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: cwm-media
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      CLAMAV_HOST: clamav
    depends_on:
      db: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      clamav: { condition: service_healthy }
    ports: ["127.0.0.1:3000:3000"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

volumes:
  dbdata:
  miniodata:
