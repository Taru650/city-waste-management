# Local development / pilot stack. Production: managed PostgreSQL with PITR, secrets from a vault,
# TLS-terminating nginx + WAF in front of the API.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: cwm
      POSTGRES_USER: cwm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [dbdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]   # never expose the DB publicly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cwm -d cwm"]
      interval: 5s
      retries: 10

  api:
    build: ../apps/api
    env_file: ../apps/api/.env
    environment:
      DATABASE_URL: postgres://cwm:${POSTGRES_PASSWORD}@db:5432/cwm
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:3000:3000"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

volumes:
  dbdata:
